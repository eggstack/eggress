[graph]
targets = []
# Review the all-features dependency graph of every workspace member.
#
# `all-features` is required because optional-only dependencies (`russh`,
# QUIC/H3, the `eggup`/`zip` updater subtree) are otherwise dropped from the
# advisory/bans/licenses/sources checks.
#
# This section cannot widen the graph roots: the root manifest here is the
# `eggress-bench` package (not a virtual manifest), so `cargo deny` treats it
# as the sole root unless the invocation adds the global `--workspace` flag.
# The gate therefore runs as `cargo deny --workspace check`; a bare
# `cargo deny check` silently omits `eggress-cli` (and therefore `zip`) and
# prints a misleading "advisories ok". Feature slicing still applies to builds
# and tests (`docs/CI_STATUS.md`); it does not restrict what is audited.
all-features = true

[advisories]
ignore = [
    # Upstream-blocked `zip 6.0.0` (Delivery M004 / Security S5).
    #
    # Path: root `eggress-cli` -> `eggup-archive 0.1.2` (and 0.2.0) ->
    # `zip = "6.0.0"`. `eggup-archive` also carries the `zip` crate for its
    # bounded Windows `.zip` extractor, so a lockfile update alone cannot
    # remove it, and the direct `zip` dependency in `eggress-cli` is
    # dev-only (test archive fixtures).
    #
    # Why the interim risk is acceptable: Eggup's extractor never calls
    # `ZipArchive::extract`/`ZipStreamReader::extract` (the APIs named by
    # these advisories). It walks entries itself, rejects symlinks, non-file
    # entries, `enclosed_name() == None`, and `..`/absolute paths, and reads
    # members through object-bound handles under finite size limits. Eggress
    # additionally verifies the whole archive SHA-256 before extraction.
    #
    # Advisories published after the gate landed (2026-11-17) are covered by
    # the same upstream block and are not reachable through Eggup's feature
    # set: `eggup-archive` disables `zip` defaults and enables only
    # `deflate-flate2`, so the `aes-crypto` path (-0545) is not compiled; it
    # never uses `ZipStreamReader` (-0548); and the -0547 legacy decoders are
    # outside the supported release-asset entry set, with the archive
    # SHA-256-verified before extraction and members read under finite
    # per-member/total limits.
    #
    # Removal condition: delete every `zip` entry here (do not carry them
    # forward) as soon as an `eggup-archive` release depending on
    # `zip >= 9.0.0` is adopted.
    #
    # Owner: Delivery M004. Reviewed 2026-11-16, extended 2026-11-17.
    # Re-review by 2027-05-01 even if no upstream release has landed; do not
    # renew silently.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0547",
    "RUSTSEC-2026-0548",
    # `chrono` is unmaintained (RUSTSEC-2026-0543), not a vulnerability. It is
    # pulled unconditionally by `russh-util 0.52.0` -> `russh 0.65.2`, which
    # is the latest published `russh` line and the fixed line for the SSH
    # advisories this program closed. Reachable only through the optional
    # `ssh` feature; no safe upgrade exists.
    #
    # Owner: Transports M005. Reviewed 2026-11-17. Re-review at the next
    # `russh`/`russh-util` release or by 2027-05-01, whichever comes first.
    "RUSTSEC-2026-0543",
]

# `rustls-pemfile` (RUSTSEC-2025-0134) was replaced by `rustls-pki-types` PEM
# APIs (`CertificateDer::pem_slice_iter`, `PrivatePkcs8KeyDer::from_pem_slice`)
# in the transport-tls crate. No unmaintained advisory remains.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # `target-lexicon` (build-dependency of `pyo3-build-config` in
    # `eggress-python`) ships under the Apache-2.0 LLVM exception.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # No OpenSSL — project is ring-only via rustls
    { name = "openssl-sys" },
    # No native-tls — project is ring-only via rustls
    { name = "native-tls" },
    # No aws-lc-sys — project uses ring for rustls crypto provider
    { name = "aws-lc-sys" },
    # No cmake builds in production dependency graph
    { name = "cmake" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
