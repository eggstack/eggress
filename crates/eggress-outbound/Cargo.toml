[package]
name = "eggress-outbound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Listener-free outbound chain execution for eggress proxy"
keywords = ["proxy", "outbound", "chain", "library"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[features]
default = []

toml = ["dep:eggress-config"]
pproxy-compat = ["dep:eggress-pproxy-compat"]
udp = ["dep:eggress-udp"]

extended = [
    "dep:eggress-protocol-shadowsocks",
    "dep:eggress-protocol-trojan",
    "dep:eggress-protocol-websocket",
]

pproxy-legacy = [
    "extended",
    "eggress-protocol-shadowsocks/pproxy-legacy",
]

legacy-crypto = [
    "extended",
    "eggress-protocol-shadowsocks/legacy-crypto",
]

ssh = ["dep:eggress-transport-ssh"]
quic = [
    "dep:eggress-transport-quic",
    "dep:eggress-protocol-h3",
]
insecure-tls = ["eggress-core/insecure-tls", "eggress-transport-tls/insecure-tls"]

[dependencies]
eggress-core.workspace = true
eggress-uri.workspace = true
eggress-protocol-http.workspace = true
eggress-protocol-socks.workspace = true
eggress-transport-tls.workspace = true
eggress-config = { workspace = true, optional = true }
eggress-pproxy-compat = { workspace = true, optional = true }
eggress-udp = { workspace = true, optional = true }
eggress-protocol-shadowsocks = { workspace = true, optional = true }
eggress-protocol-trojan = { workspace = true, optional = true }
eggress-protocol-websocket = { workspace = true, optional = true }
eggress-transport-ssh = { workspace = true, optional = true }
eggress-transport-quic = { workspace = true, optional = true }
eggress-protocol-h3 = { workspace = true, optional = true }
bytes.workspace = true
h2.workspace = true
http.workspace = true
rustls.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
subtle.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
eggress-testkit.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "test-util", "time"] }
futures-util.workspace = true
tokio-tungstenite.workspace = true
rcgen = "0.13"

[lints]
workspace = true
