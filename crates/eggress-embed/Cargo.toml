[package]
name = "eggress-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable Rust embed API for eggress proxy"
keywords = ["proxy", "embed", "api", "library"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[features]
default = ["full"]
full = ["common", "extended", "operations", "reverse", "pproxy-compat", "pproxy-legacy"]
common = ["eggress-runtime/common"]
extended = ["eggress-runtime/extended", "eggress-outbound/extended"]
pproxy-legacy = ["eggress-runtime/pproxy-legacy", "eggress-outbound/pproxy-legacy"]
legacy-crypto = ["eggress-runtime/legacy-crypto", "eggress-outbound/legacy-crypto"]
operations = ["eggress-runtime/operations"]
reverse = ["eggress-runtime/reverse"]
quic = [
    "eggress-config/quic",
    "eggress-runtime/quic",
    "eggress-outbound/quic",
]
pproxy-compat = ["dep:eggress-pproxy-compat", "eggress-outbound/pproxy-compat"]
ssh = [
    "dep:eggress-transport-ssh",
    "eggress-runtime/ssh",
    "eggress-outbound/ssh",
    "eggress-pproxy-compat?/ssh",
]

[dependencies]
eggress-config = { workspace = true }
eggress-outbound = { workspace = true, features = ["toml", "udp"] }
eggress-pproxy-compat = { workspace = true, optional = true }
eggress-runtime = { workspace = true }
eggress-uri = { workspace = true }
eggress-transport-ssh = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
eggress-protocol-http = { workspace = true }
eggress-config = { workspace = true }
eggress-core = { workspace = true }
eggress-relay = { workspace = true }
eggress-routing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-test = { workspace = true }

[lints]
workspace = true
