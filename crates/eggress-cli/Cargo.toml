[package]
name = "eggress-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI binary for the eggress multi-protocol proxy"
keywords = ["proxy", "cli", "pproxy", "command-line"]
categories = ["network-programming", "command-line-utilities"]
readme = "README.md"

[features]
default = ["full"]
full = ["common", "extended", "operations", "reverse", "pproxy-compat"]
common = ["eggress-runtime/common"]
extended = ["eggress-runtime/extended"]
pproxy-legacy = ["eggress-runtime/pproxy-legacy"]
legacy-crypto = [
    "eggress-runtime/legacy-crypto",
    "eggress-pproxy-compat/legacy-crypto",
]
pproxy-daemon = ["pproxy-compat", "eggress-pproxy-compat/daemon"]
operations = ["dep:eggress-system-proxy", "eggress-runtime/operations"]
reverse = ["eggress-runtime/reverse"]
quic = [
    "eggress-config/quic",
    "eggress-runtime/quic",
    "eggress-pproxy-compat/quic",
    "dep:eggress-transport-quic",
    "dep:eggress-protocol-h3",
]
insecure-quic = ["eggress-runtime/insecure-quic", "eggress-transport-quic/insecure-quic"]
pproxy-compat = ["dep:eggress-pproxy-compat"]
ssh = ["eggress-runtime/ssh", "eggress-pproxy-compat/ssh"]

[[bin]]
name = "eggress"
path = "src/main.rs"

[[bin]]
name = "pproxy"
path = "src/pproxy_main.rs"
required-features = ["pproxy-compat"]

[dependencies]
eggress-core.workspace = true
eggress-server.workspace = true
eggress-uri.workspace = true
eggress-routing.workspace = true
eggress-config.workspace = true
eggress-runtime.workspace = true
eggress-metrics.workspace = true
eggress-protocol-http.workspace = true
eggress-protocol-socks.workspace = true
eggress-transport-quic = { workspace = true, optional = true }
eggress-protocol-h3 = { workspace = true, optional = true }
eggress-pproxy-compat = { workspace = true, optional = true }
eggress-system-proxy = { workspace = true, optional = true }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
serde.workspace = true
http.workspace = true

[dev-dependencies]
eggress-testkit.workspace = true
eggress-protocol-http.workspace = true
eggress-protocol-socks.workspace = true
eggress-protocol-shadowsocks.workspace = true
eggress-protocol-trojan.workspace = true
eggress-transport-tls = { workspace = true, features = ["insecure-tls"] }
eggress-udp.workspace = true
eggress-routing.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
base64 = "0.22"
rand.workspace = true
rcgen.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
toml.workspace = true

[lints]
workspace = true
