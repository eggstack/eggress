[package]
name = "eggress-runtime"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["full"]
full = ["common", "extended", "operations", "reverse"]
common = ["eggress-server/common"]
extended = [
    "dep:eggress-protocol-shadowsocks",
    "eggress-server/extended",
    "eggress-metrics/extended",
    "eggress-udp/shadowsocks",
]
pproxy-legacy = ["extended", "eggress-server/pproxy-legacy", "eggress-protocol-shadowsocks/pproxy-legacy"]
operations = [
    "dep:eggress-admin",
    "dep:eggress-system-proxy",
]
reverse = ["dep:eggress-protocol-reverse", "operations"]
ssh = ["eggress-server/ssh", "dep:eggress-transport-ssh"]

[dependencies]
eggress-core.workspace = true
eggress-config.workspace = true
eggress-routing.workspace = true
eggress-server.workspace = true
eggress-admin = { workspace = true, optional = true }
eggress-metrics.workspace = true
eggress-uri.workspace = true
eggress-udp.workspace = true
eggress-transport-tls.workspace = true
eggress-transport-ssh = { workspace = true, optional = true }
eggress-protocol-shadowsocks = { workspace = true, optional = true }
eggress-protocol-reverse = { workspace = true, optional = true }
eggress-system-proxy = { workspace = true, optional = true }
rustls.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
arc-swap.workspace = true
fastrand.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
eggress-admin.workspace = true
eggress-routing.workspace = true
eggress-core.workspace = true
eggress-uri.workspace = true
eggress-testkit.workspace = true
rcgen = "0.13"
eggress-transport-tls.workspace = true
eggress-protocol-trojan.workspace = true
eggress-protocol-shadowsocks.workspace = true
eggress-protocol-websocket.workspace = true
eggress-protocol-http.workspace = true
h2.workspace = true
http.workspace = true
bytes.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[lints]
workspace = true
