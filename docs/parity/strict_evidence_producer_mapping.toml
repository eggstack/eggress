# CE8: Strict Differential Evidence Index
#
# Maps each strict test file to its required observation RIDs
# and the probe script that produces each observation.
#
# This file is consumed by build_strict_evidence_index.py.

[[producer]]
rid = "python.pproxy.proto"
test_files = [
    "python/tests/strict/test_protocol_differential.py",
    "python/tests/strict/test_top_level_api_differential.py",
]
probe = "strict_api_probe.py"
module = "pproxy.proto"

