name: Publish Python packages to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Target registry"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

# Canonical Tier A wheel matrix: ten ordinary-CPython `cp39-abi3` wheel
# families plus one sdist (see `scripts/validate_release_artifacts.py`, which
# is the canonical validation table and must be updated together with the
# matrix below when an approved target is added or removed).
#
# Target conventions follow `maturin generate-ci` (maturin 1.14): short target
# aliases (`x86_64`, `aarch64`, `armv7`, `x64`) with an explicit `manylinux`
# policy per Linux entry. `musllinux_1_2` selects the musl wheel family.
# GNU armv7l uses the `2_28` floor: PyPA never shipped an armv7l
# manylinux2014 tag, so one must not be invented here, and maturin-action has
# no container for armv7l at `2_31` (it falls back to a host build where
# `ring` misses its cross-gcc). `2_28` is the newest floor with container
# support (`ghcr.io/rust-cross/manylinux_2_28-cross:armv7`); the validator
# accepts any real `manylinux_*_armv7l` floor.
#
# Tier B (i686/ppc64le/s390x/riscv64 GNU+musl) is deferred until Tier A is
# green: each target still needs a PyPA-image build proof, a dependency-graph
# build without feature reduction, and an executable smoke before it can join
# the required set. Free-threaded CPython (`abi3t`/version-specific `t`
# wheels) is explicitly separate and is not built here.
#
# maturin is deliberately versioned: `maturin-version` below and the pip
# `maturin==` pin in `build-sdist` must move together within the
# `maturin>=1.0,<2.0` range required by `crates/eggress-python/pyproject.toml`.

env:
  MATURIN_VERSION: "v1.14.1"

jobs:
  validate:
    name: Validate version coherence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Extract versions and verify coherence
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          def field(path: str, *keys: str) -> str:
              value = tomllib.loads(Path(path).read_text())
              for key in keys:
                  value = value[key]
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"::error::{path} has no string field {'/'.join(keys)}")
              return value

          workspace = field("Cargo.toml", "workspace", "package", "version")
          binding_manifest = tomllib.loads(Path("crates/eggress-python/Cargo.toml").read_text())
          binding_version = binding_manifest.get("package", {}).get("version")
          if isinstance(binding_version, dict):
              # The binding crate inherits its version from the workspace
              # (`version.workspace = true`); resolve it the same way cargo does.
              if binding_version.get("workspace") is not True:
                  raise SystemExit("::error::crates/eggress-python/Cargo.toml package/version must be a string or workspace-inherited")
              binding = workspace
          elif isinstance(binding_version, str) and binding_version:
              binding = binding_version
          else:
              raise SystemExit("::error::crates/eggress-python/Cargo.toml has no string field package/version")
          project = field("crates/eggress-python/pyproject.toml", "project", "version")
          versions = {"workspace": workspace, "binding": binding, "pyproject": project}
          print(*[f"{name} version: {value}" for name, value in versions.items()], sep="\n")
          if len(set(versions.values())) != 1:
              raise SystemExit(f"::error::version mismatch: {versions}")

          tag = os.environ.get("RELEASE_TAG", "")
          if tag:
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
                  raise SystemExit(f"::error::production tag must be vMAJOR.MINOR.PATCH: {tag}")
              expected = tag[1:]
              if expected != workspace:
                  raise SystemExit(f"::error::tag version {expected} != workspace version {workspace}")
              print(f"tag version matches: {tag}")
          else:
              print("manual dispatch: internal version coherence verified")
          PY

  build-wheels:
    name: "Build wheel (${{ matrix.family }})"
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            family: linux-x86_64-gnu
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
            family: linux-aarch64-gnu
          - os: ubuntu-latest
            target: armv7
            manylinux: "2_28"
            family: linux-armv7l-gnu
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            family: linux-x86_64-musl
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
            family: linux-aarch64-musl
          - os: ubuntu-latest
            target: armv7
            manylinux: musllinux_1_2
            family: linux-armv7l-musl
          - os: macos-15-intel
            target: x86_64
            family: macos-x86_64
          - os: macos-14
            target: aarch64
            family: macos-arm64
          - os: windows-latest
            target: x64
            family: windows-x86_64
          - os: windows-11-arm
            target: aarch64
            family: windows-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup QEMU
        if: runner.os == 'Linux' && matrix.target == 'armv7'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist -m crates/eggress-python/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          maturin-version: ${{ env.MATURIN_VERSION }}

      - name: List artifacts
        shell: bash
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.family }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip "maturin==1.14.1"

      - name: Build sdist
        run: maturin sdist --out dist -m crates/eggress-python/Cargo.toml

      - name: Verify sdist contents
        shell: bash
        run: |
          set -euo pipefail
          SDIST=$(ls dist/*.tar.gz)
          echo "Built sdist: ${SDIST}"
          # List via a file: `tar ... | head` trips pipefail with SIGPIPE.
          tar tzf "${SDIST}" > sdist_contents.txt
          wc -l sdist_contents.txt
          head -30 sdist_contents.txt
          echo "sdist built successfully (clean-install smoke validates contents)"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  collect-artifacts:
    name: Collect and validate artifacts
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Validate artifact set
        shell: bash
        run: |
          set -euo pipefail
          echo "=== All artifacts ==="
          ls -la dist/
          python -m pip install --upgrade pip "packaging>=24"
          python3 scripts/validate_release_artifacts.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

  smoke-test:
    name: "Smoke test (${{ matrix.os }})"
    needs: collect-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-15-intel
          - os: macos-14
          - os: windows-latest
          - os: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find matching wheel
        id: find-wheel
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM=$(python -c "import sys, platform; print(platform.system().lower())")
          ARCH=$(python -c "import platform; print(platform.machine().lower())")
          echo "Platform: ${PLATFORM} ${ARCH}"

          WHEEL=""
          for whl in dist/*.whl; do
            NAME=$(basename "${whl}")
            case "${PLATFORM}" in
              linux)
                # GNU wheels only here; musllinux has its own smoke job.
                # ("musllinux" contains no "manylinux" substring.)
                if echo "${NAME}" | grep -q "manylinux" && echo "${NAME}" | grep -q "${ARCH}"; then
                  WHEEL="${whl}"
                  break
                fi
                ;;
              darwin)
                if echo "${NAME}" | grep -q "macosx"; then
                  if [[ "${ARCH}" == "arm64" ]] && echo "${NAME}" | grep -q "arm64"; then
                    WHEEL="${whl}"
                    break
                  elif [[ "${ARCH}" == "x86_64" ]] && echo "${NAME}" | grep -q "x86_64"; then
                    WHEEL="${whl}"
                    break
                  fi
                fi
                ;;
              windows)
                if [[ "${ARCH}" == "arm64" ]]; then
                  if echo "${NAME}" | grep -q "win_arm64"; then
                    WHEEL="${whl}"
                    break
                  fi
                elif echo "${NAME}" | grep -q "win_amd64"; then
                  WHEEL="${whl}"
                  break
                fi
                ;;
            esac
          done

          if [[ -z "${WHEEL}" ]]; then
            echo "::error::No matching wheel found for ${PLATFORM} ${ARCH}"
            ls dist/*.whl
            exit 1
          fi

          echo "Found wheel: $(basename ${WHEEL})"
          echo "wheel_path=${WHEEL}" >> "$GITHUB_OUTPUT"

      - name: Install and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-test
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv-test/Scripts/python.exe -m pip install --upgrade pip
            .venv-test/Scripts/python.exe -m pip install "${{ steps.find-wheel.outputs.wheel_path }}"
            .venv-test/Scripts/python.exe -m pip install --no-deps ./python-pproxy-compat
            .venv-test/Scripts/python.exe scripts/release_artifact_smoke.py
            echo "=== target evidence ==="
            .venv-test/Scripts/python.exe -c "import platform, sys; print('machine:', platform.machine()); print(sys.version); print('libc:', platform.libc_ver())"
            echo "wheel: ${{ steps.find-wheel.outputs.wheel_path }}"
          else
            .venv-test/bin/python -m pip install --upgrade pip
            .venv-test/bin/python -m pip install "${{ steps.find-wheel.outputs.wheel_path }}"
            .venv-test/bin/python -m pip install --no-deps ./python-pproxy-compat
            .venv-test/bin/python scripts/release_artifact_smoke.py
            echo "=== target evidence ==="
            .venv-test/bin/python -c "import platform, sys; print('machine:', platform.machine()); print(sys.version); print('libc:', platform.libc_ver())"
            echo "wheel: ${{ steps.find-wheel.outputs.wheel_path }}"
          fi
          echo "Smoke test passed"

  musl-smoke:
    name: "musllinux smoke (${{ matrix.os }})"
    needs: collect-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find matching musl wheel
        id: find-wheel
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*musllinux*${{ matrix.arch }}*.whl | head -1)
          if [[ -z "${WHEEL}" ]]; then
            echo "::error::No musllinux ${{ matrix.arch }} wheel found"
            ls dist/*.whl
            exit 1
          fi
          echo "Found wheel: $(basename ${WHEEL})"
          echo "wheel_path=${WHEEL}" >> "$GITHUB_OUTPUT"

      - name: Install and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-musl
          .venv-musl/bin/python -m pip install --upgrade pip
          .venv-musl/bin/python -m pip install "${{ steps.find-wheel.outputs.wheel_path }}"
          .venv-musl/bin/python -m pip install --no-deps ./python-pproxy-compat
          .venv-musl/bin/python scripts/release_artifact_smoke.py
          echo "=== target evidence ==="
          .venv-musl/bin/python -c "import platform, sys; print('machine:', platform.machine()); print(sys.version); print('libc:', platform.libc_ver())"
          echo "wheel: ${{ steps.find-wheel.outputs.wheel_path }}"
          echo "musllinux ${{ matrix.arch }} smoke passed"

  armv7-smoke:
    name: "ARMv7 smoke (QEMU)"
    needs: collect-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Smoke GNU + musl armv7 wheels under QEMU
        shell: bash
        run: |
          set -euo pipefail
          ls dist/*armv7l*.whl
          for WHEEL in dist/*armv7l*.whl; do
            echo "=== Smoking $(basename ${WHEEL}) ==="
            docker run --rm --platform linux/arm/v7 \
              -v "${PWD}:/io" -w /io python:3.12-slim bash -c "
              set -euo pipefail
              python -m pip install --upgrade pip
              python -m pip install '/io/${WHEEL}'
              python -m pip install --no-deps /io/python-pproxy-compat
              python -c 'import platform, sys; print(\"machine:\", platform.machine()); print(sys.version); print(\"libc:\", platform.libc_ver())'
              echo 'wheel: ${WHEEL}'
              python /io/scripts/release_artifact_smoke.py
            "
          done
          echo "ARMv7 smoke passed"

  compat-smoke:
    name: "Compatibility smoke (Python ${{ matrix.python-version }})"
    needs: collect-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Python 3.15 is pre-release at the planning baseline; allow the RC
          # lane without affecting stable-version resolution.
          allow-prereleases: true

      - name: Find manylinux wheel
        id: find-wheel
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*manylinux*x86_64*.whl | head -1)
          if [[ -z "${WHEEL}" ]]; then
            echo "::error::No manylinux x86_64 wheel found"
            exit 1
          fi
          echo "Found wheel: $(basename ${WHEEL})"
          echo "wheel_path=${WHEEL}" >> "$GITHUB_OUTPUT"

      - name: Install and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-compat
          .venv-compat/bin/python -m pip install --upgrade pip
          .venv-compat/bin/python -m pip install "${{ steps.find-wheel.outputs.wheel_path }}"
          .venv-compat/bin/python -m pip install --no-deps ./python-pproxy-compat
          .venv-compat/bin/python scripts/release_artifact_smoke.py
          echo "Python ${{ matrix.python-version }} compat smoke passed"

  sdist-smoke:
    name: "Sdist clean-install smoke"
    needs: collect-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Find sdist
        id: find-sdist
        shell: bash
        run: |
          set -euo pipefail
          SDIST=$(ls dist/*.tar.gz | head -1)
          if [[ -z "${SDIST}" ]]; then
            echo "::error::No sdist found"
            exit 1
          fi
          echo "Found sdist: $(basename ${SDIST})"
          echo "sdist_path=${SDIST}" >> "$GITHUB_OUTPUT"

      - name: Install and smoke test from sdist
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --upgrade pip
          .venv-sdist/bin/python -m pip install "${{ steps.find-sdist.outputs.sdist_path }}"
          .venv-sdist/bin/python -m pip install --no-deps ./python-pproxy-compat
          .venv-sdist/bin/python scripts/release_artifact_smoke.py
          echo "Sdist clean-install smoke passed"

  publish-pypi:
    name: Publish to PyPI
    needs: [smoke-test, musl-smoke, armv7-smoke, compat-smoke, sdist-smoke]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'pypi')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/eggress
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: List artifacts to publish
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Production publication must fail on existing version, not skip

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [smoke-test, musl-smoke, armv7-smoke, compat-smoke, sdist-smoke]
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/eggress
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
