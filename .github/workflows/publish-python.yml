name: Publish Python packages to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Target registry"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate version coherence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Extract versions and verify coherence
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          def field(path: str, *keys: str) -> str:
              value = tomllib.loads(Path(path).read_text())
              for key in keys:
                  value = value[key]
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"::error::{path} has no string field {'/'.join(keys)}")
              return value

          workspace = field("Cargo.toml", "workspace", "package", "version")
          binding = field("crates/eggress-python/Cargo.toml", "package", "version")
          project = field("crates/eggress-python/pyproject.toml", "project", "version")
          versions = {"workspace": workspace, "binding": binding, "pyproject": project}
          print(*[f"{name} version: {value}" for name, value in versions.items()], sep="\n")
          if len(set(versions.values())) != 1:
              raise SystemExit(f"::error::version mismatch: {versions}")

          tag = os.environ.get("RELEASE_TAG", "")
          if tag:
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
                  raise SystemExit(f"::error::production tag must be vMAJOR.MINOR.PATCH: {tag}")
              expected = tag[1:]
              if expected != workspace:
                  raise SystemExit(f"::error::tag version {expected} != workspace version {workspace}")
              print(f"tag version matches: {tag}")
          else:
              print("manual dispatch: internal version coherence verified")
          PY

  build-wheels:
    name: "Build wheel (${{ matrix.os }}, ${{ matrix.target }})"
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: 2014
          - os: ubuntu-latest
            target: aarch64
            manylinux: 2014
          - os: macos-13
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup QEMU
        if: runner.os == 'Linux' && matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m crates/eggress-python/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: List artifacts
        shell: bash
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip "maturin>=1.0,<2.0"

      - name: Build sdist
        run: maturin sdist --out dist -m crates/eggress-python/Cargo.toml

      - name: Verify sdist contents
        shell: bash
        run: |
          set -euo pipefail
          SDIST=$(ls dist/*.tar.gz)
          echo "Built sdist: ${SDIST}"
          tar tzf "${SDIST}" | head -30

          # Verify key contents
          tar tzf "${SDIST}" | grep -q "Cargo.toml" || { echo "::error::sdist missing Cargo.toml"; exit 1; }
          tar tzf "${SDIST}" | grep -q "pyproject.toml" || { echo "::error::sdist missing pyproject.toml"; exit 1; }
          tar tzf "${SDIST}" | grep -q "eggress/__init__.py" || { echo "::error::sdist missing eggress/__init__.py"; exit 1; }
          tar tzf "${SDIST}" | grep -q "pproxy/__init__.py" || { echo "::error::sdist missing pproxy/__init__.py"; exit 1; }
          echo "sdist contents verified"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  collect-artifacts:
    name: Collect and validate artifacts
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Validate artifact set
        shell: bash
        run: |
          set -euo pipefail
          echo "=== All artifacts ==="
          ls -la dist/
          python3 - <<'PY'
          import re
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 5:
              raise SystemExit(f"::error::expected exactly five wheels, found {len(wheels)}")
          if len(sdists) != 1:
              raise SystemExit(f"::error::expected exactly one sdist, found {len(sdists)}")

          version = None
          targets = {}
          for wheel in wheels:
              name = wheel.name[:-4]
              parts = name.split("-")
              if len(parts) != 5 or parts[0] != "eggress":
                  raise SystemExit(f"::error::unexpected wheel filename: {wheel.name}")
              _, wheel_version, python_tag, abi_tag, platform_tag = parts
              if version is None:
                  version = wheel_version
              if wheel_version != version:
                  raise SystemExit(f"::error::wheel version mismatch: {wheel.name}")
              if python_tag != "cp39" or abi_tag != "abi3":
                  raise SystemExit(f"::error::wheel is not cp39-abi3: {wheel.name}")

              if "manylinux" in platform_tag and platform_tag.endswith("x86_64"):
                  target = "linux-x86_64"
              elif "manylinux" in platform_tag and platform_tag.endswith("aarch64"):
                  target = "linux-aarch64"
              elif platform_tag.startswith("macosx_") and platform_tag.endswith("x86_64"):
                  target = "macos-x86_64"
              elif platform_tag.startswith("macosx_") and platform_tag.endswith("arm64"):
                  target = "macos-arm64"
              elif re.search(r"(?:^|_)win_amd64$", platform_tag):
                  target = "windows-x86_64"
              else:
                  raise SystemExit(f"::error::unapproved wheel platform: {wheel.name}")
              if target in targets:
                  raise SystemExit(f"::error::duplicate wheel target {target}: {wheel.name}")
              targets[target] = wheel.name

          expected = {"linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-arm64", "windows-x86_64"}
          if set(targets) != expected:
              raise SystemExit(f"::error::wheel target set mismatch: {set(targets)}")
          if not re.fullmatch(r"eggress-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz", sdists[0].name):
              raise SystemExit(f"::error::unexpected sdist filename: {sdists[0].name}")
          if version is None or sdists[0].name != f"eggress-{version}.tar.gz":
              raise SystemExit(f"::error::sdist version does not match wheels: {sdists[0].name}")
          if any("debug" in path.name.lower() for path in [*wheels, *sdists]):
              raise SystemExit("::error::debug artifact found")

          print("approved artifact set:")
          for target, filename in sorted(targets.items()):
              print(f"  {target}: {filename}")
          print(f"  sdist: {sdists[0].name}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

  smoke-test:
    name: "Smoke test (${{ matrix.os }})"
    needs: collect-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-14
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find matching wheel
        id: find-wheel
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM=$(python -c "import sys, platform; print(platform.system().lower())")
          ARCH=$(python -c "import platform; print(platform.machine().lower())")
          echo "Platform: ${PLATFORM} ${ARCH}"

          WHEEL=""
          for whl in dist/*.whl; do
            NAME=$(basename "${whl}")
            case "${PLATFORM}" in
              linux)
                if echo "${NAME}" | grep -q "manylinux" && echo "${NAME}" | grep -q "${ARCH}"; then
                  WHEEL="${whl}"
                  break
                fi
                ;;
              darwin)
                if echo "${NAME}" | grep -q "macosx"; then
                  if [[ "${ARCH}" == "arm64" ]] && echo "${NAME}" | grep -q "arm64"; then
                    WHEEL="${whl}"
                    break
                  elif [[ "${ARCH}" == "x86_64" ]] && echo "${NAME}" | grep -q "x86_64"; then
                    WHEEL="${whl}"
                    break
                  fi
                fi
                ;;
              windows)
                if echo "${NAME}" | grep -q "win"; then
                  WHEEL="${whl}"
                  break
                fi
                ;;
            esac
          done

          if [[ -z "${WHEEL}" ]]; then
            echo "::error::No matching wheel found for ${PLATFORM} ${ARCH}"
            ls dist/*.whl
            exit 1
          fi

          echo "Found wheel: $(basename ${WHEEL})"
          echo "wheel_path=${WHEEL}" >> "$GITHUB_OUTPUT"

      - name: Install and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-test
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv-test/Scripts/python.exe -m pip install --upgrade pip
            .venv-test/Scripts/python.exe -m pip install "${{ steps.find-wheel.outputs.wheel_path }}"
            .venv-test/Scripts/python.exe scripts/release_artifact_smoke.py
          else
            .venv-test/bin/python -m pip install --upgrade pip
            .venv-test/bin/python -m pip install "${{ steps.find-wheel.outputs.wheel_path }}"
            .venv-test/bin/python scripts/release_artifact_smoke.py
          fi
          echo "Smoke test passed"

  compat-smoke:
    name: "Compatibility smoke (Python ${{ matrix.python-version }})"
    needs: collect-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Find manylinux wheel
        id: find-wheel
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*manylinux*x86_64*.whl | head -1)
          if [[ -z "${WHEEL}" ]]; then
            echo "::error::No manylinux x86_64 wheel found"
            exit 1
          fi
          echo "Found wheel: $(basename ${WHEEL})"
          echo "wheel_path=${WHEEL}" >> "$GITHUB_OUTPUT"

      - name: Install and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-compat
          .venv-compat/bin/python -m pip install --upgrade pip
          .venv-compat/bin/python -m pip install "${{ steps.find-wheel.outputs.wheel_path }}"
          .venv-compat/bin/python scripts/release_artifact_smoke.py
          echo "Python ${{ matrix.python-version }} compat smoke passed"

  sdist-smoke:
    name: "Sdist clean-install smoke"
    needs: collect-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Find sdist
        id: find-sdist
        shell: bash
        run: |
          set -euo pipefail
          SDIST=$(ls dist/*.tar.gz | head -1)
          if [[ -z "${SDIST}" ]]; then
            echo "::error::No sdist found"
            exit 1
          fi
          echo "Found sdist: $(basename ${SDIST})"
          echo "sdist_path=${SDIST}" >> "$GITHUB_OUTPUT"

      - name: Install and smoke test from sdist
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --upgrade pip
          .venv-sdist/bin/python -m pip install "${{ steps.find-sdist.outputs.sdist_path }}"
          .venv-sdist/bin/python scripts/release_artifact_smoke.py
          echo "Sdist clean-install smoke passed"

  publish-pypi:
    name: Publish to PyPI
    needs: [smoke-test, compat-smoke, sdist-smoke]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'pypi')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/eggress
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: List artifacts to publish
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Production publication must fail on existing version, not skip

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [smoke-test, compat-smoke, sdist-smoke]
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/eggress
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
