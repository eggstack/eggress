name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check optional compat features
        run: >-
          cargo check -p eggress-cli --locked --no-default-features
          --features full,ssh,quic,pproxy-legacy,legacy-crypto,pproxy-daemon
          --bins
      - name: Check embed SSH feature boundaries
        run: >-
          cargo check -p eggress-embed --locked --no-default-features
          --features ssh &&
          cargo check -p eggress-embed --locked --no-default-features
          --features pproxy-compat &&
          cargo check -p eggress-embed --locked --no-default-features
          --features ssh,pproxy-compat
      - name: Check outbound feature boundaries
        run: >-
          cargo check -p eggress-outbound --locked --no-default-features &&
          cargo check -p eggress-outbound --locked --no-default-features
          --features toml &&
          cargo check -p eggress-outbound --locked --no-default-features
          --features pproxy-compat &&
          cargo check -p eggress-outbound --locked --no-default-features
          --features ssh &&
          cargo check -p eggress-outbound --locked --no-default-features
          --features ssh,pproxy-compat &&
          cargo check -p eggress-outbound --locked --no-default-features
          --features udp
      - name: Install OpenSSH test server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
      - name: Run embed SSH runtime regression
        env:
          EGRESS_REQUIRE_OPENSSH_TESTS: "1"
        run: >-
          cargo test -p eggress-embed --locked --no-default-features
          --features ssh,pproxy-compat --test ssh -- --nocapture
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  updater-matrix:
    # Delivery M003 evidence: the updater/archive path must execute (not
    # merely compile) on Linux, macOS, and Windows. Shell-candidate flow
    # tests are Unix-gated by design; the Windows lane executes mapping,
    # budget, ownership, outcome-mapping, lock-contention, extraction,
    # rejection, and zip stage/commit tests through the real Eggup path.
    name: Updater path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Updater unit and archive-path tests
        run: cargo test -p eggress-cli --locked --bin eggress update::
      - name: Updater contract suites
        run: cargo test -p eggress-cli --locked --test release_contract --test cli_exit_codes
